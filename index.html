  <style>
    /* Global lock for touch-scrolling prevention on active game areas */
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      box-sizing: border-box;
    }

    body {
      font-family: 'Fredoka', 'Quicksand', cursive, sans-serif;
      touch-action: pan-y;
      background: linear-gradient(135deg, #f0fdf4 0%, #e0f2fe 50%, #fef3c7 100%);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Prevent scrolling inside drawing canvas and interactive cards */
    .touch-draw-area {
      touch-action: none;
    }

    /* Pop bouncy animations */
    .btn-bounce {
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.15s ease;
    }
    .btn-bounce:active {
      transform: scale(0.92) translateY(2px);
    }

    /* Shaking for wrong answers */
    @keyframes shakeAnimation {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .shake {
      animation: shakeAnimation 0.4s ease-in-out;
    }

    /* Pulse for celebration */
    @keyframes cheerPulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
    .cheer {
      animation: cheerPulse 0.5s ease-in-out;
    }

    @keyframes popInBounce {
      0% { transform: scale(0.4) rotate(-5deg); opacity: 0; }
      60% { transform: scale(1.08) rotate(2deg); opacity: 1; }
      80% { transform: scale(0.96) rotate(-1deg); }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    .popup-bounce {
      animation: popInBounce 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes starTrophyPop {
      0% { transform: scale(0); opacity: 0; }
      50% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .star-pop-1 { animation: starTrophyPop 0.4s ease 0.15s both; }
    .star-pop-2 { animation: starTrophyPop 0.4s ease 0.3s both; }
    .star-pop-3 { animation: starTrophyPop 0.4s ease 0.45s both; }

    @keyframes ribbonFloat {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(4deg); }
    }
    .float-fun {
      animation: ribbonFloat 2s ease-in-out infinite;
    }

    /* Smooth shadow elevation */
    .card-bubble {
      box-shadow: 0 10px 0 rgba(0, 0, 0, 0.08), 0 15px 25px rgba(0, 0, 0, 0.06);
    }
    .card-bubble-sm {
      box-shadow: 0 5px 0 rgba(0, 0, 0, 0.07);
    }

    /* Dot connection points */
    .dot-node {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 3.5px solid #ffffff;
      box-shadow: 0 0 0 3px currentColor;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .dot-node.active {
      transform: scale(1.35);
    }
  </style>

  <script>
    /* Audio Synthesis via Web Audio API (No external sound files required) */
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playPop() {
        if (!this.enabled) return;
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(320, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(700, this.ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.08);
      }
      playSuccess() {
        if (!this.enabled) return;
        this.init();
        const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.08);
          gain.gain.setValueAtTime(0.25, this.ctx.currentTime + idx * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.08 + 0.25);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(this.ctx.currentTime + idx * 0.08);
          osc.stop(this.ctx.currentTime + idx * 0.08 + 0.25);
        });
      }
      playWrong() {
        if (!this.enabled) return;
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, this.ctx.currentTime);
        osc.frequency.linearRampToValueAtTime(110, this.ctx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.2);
      }
      playFanfare() {
        if (!this.enabled) return;
        this.init();
        // Joyous trumpet-like fanfare: C5, G5, C6, E6, G6
        const notes = [
          { f: 523.25, d: 0.1, t: 0.0 },
          { f: 659.25, d: 0.1, t: 0.1 },
          { f: 783.99, d: 0.12, t: 0.2 },
          { f: 1046.50, d: 0.35, t: 0.34 },
          { f: 1318.51, d: 0.45, t: 0.48 }
        ];
        notes.forEach(note => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(note.f, this.ctx.currentTime + note.t);
          gain.gain.setValueAtTime(0.28, this.ctx.currentTime + note.t);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + note.t + note.d);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(this.ctx.currentTime + note.t);
          osc.stop(this.ctx.currentTime + note.t + note.d);
        });
      }
    }

      function drawLines() {
        svg.innerHTML = '';
        connections.forEach((targetId, srcId) => {
          const lEl = container.querySelector(`.match-left[data-id="${srcId}"] .dot-node`);
          const rEl = container.querySelector(`.match-right[data-id="${targetId}"] .dot-node`);
          if (lEl && rEl) {
            const svgRect = svg.getBoundingClientRect();
            const lRect = lEl.getBoundingClientRect();
            const rRect = rEl.getBoundingClientRect();
            const x1 = lRect.left + lRect.width / 2 - svgRect.left;
            const y1 = lRect.top + lRect.height / 2 - svgRect.top;
            const x2 = rRect.left + rRect.width / 2 - svgRect.left;
            const y2 = rRect.top + rRect.height / 2 - svgRect.top;

            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', x1);
            line.setAttribute('y1', y1);
            line.setAttribute('x2', x2);
            line.setAttribute('y2', y2);
            line.setAttribute('stroke', '#10b981');
            line.setAttribute('stroke-width', '5');
            line.setAttribute('stroke-linecap', 'round');
            line.setAttribute('stroke-dasharray', '8,6');
            svg.appendChild(line);
          }
        });
      }

      leftCards.forEach(card => {

    /* TRACING & DRAWING ENGINE */
    function renderTracing(act) {
      toolbarDrawing.classList.remove('hidden');

        <div class="relative w-full h-full flex flex-col justify-around p-2">
          ${act.paths.map(p => `

              <div class="flex-1 px-4 flex items-center">
                <svg width="100%" height="60" class="overflow-visible">
                  ${getSvgPathCode(p.shape, p.color)}
                </svg>
              </div>
              <span class="text-4xl sm:text-5xl">${p.end}</span>
            </div>
          `).join('')}
          <canvas id="paint-canvas" class="absolute inset-0 w-full h-full z-10 touch-draw-area"></canvas>
        </div>
      `;

      initPaintCanvas();
    }

    function getSvgPathCode(shape, color) {
      if (shape === 'line') {
        return `<line x1="5" y1="30" x2="98%" y2="30" stroke="${color}" stroke-width="7" stroke-dasharray="10,10" stroke-linecap="round"/>`;
      } else if (shape === 'zigzag') {
        return `<path d="M 5,30 L 35,8 L 70,52 L 105,8 L 140,52 L 175,8 L 210,52 L 245,30" stroke="${color}" stroke-width="6" stroke-dasharray="8,8" fill="none" stroke-linecap="round"/>`;
      } else if (shape === 'wave') {
        return `<path d="M 5,30 Q 40,0 75,30 T 145,30 T 215,30 T 285,30" stroke="${color}" stroke-width="6" stroke-dasharray="7,7" fill="none" stroke-linecap="round"/>`;
      } else if (shape === 'spiral') {
        return `<circle cx="50%" cy="30" r="24" stroke="${color}" stroke-width="6" stroke-dasharray="6,6" fill="none"/>`;
      }
      return '';
    }

    function initPaintCanvas() {
      const cvs = document.getElementById('paint-canvas');
      if (!cvs) return;
      const rect = cvs.parentElement.getBoundingClientRect();
      cvs.width = rect.width;
      cvs.height = rect.height;
      const ctx = cvs.getContext('2d');
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.lineWidth = 12;

      let isDrawing = false;
      let lastX = 0;
      let lastY = 0;

      function getPos(e) {
        const cRect = cvs.getBoundingClientRect();
        if (e.touches && e.touches[0]) {
          return {
            x: e.touches[0].clientX - cRect.left,
            y: e.touches[0].clientY - cRect.top
          };
        }
        return {
          x: e.clientX - cRect.left,
          y: e.clientY - cRect.top
        };
      }

      function startDraw(e) {
        e.preventDefault();
        isDrawing = true;
        const pos = getPos(e);
        lastX = pos.x;
        lastY = pos.y;
        sound.playPop();
      }

      function drawMove(e) {
        if (!isDrawing) return;
        e.preventDefault();
        const pos = getPos(e);
        ctx.strokeStyle = state.brushColor;
        ctx.beginPath();
        ctx.moveTo(lastX, lastY);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
        lastX = pos.x;
        lastY = pos.y;
      }

      function stopDraw(e) {
        if (isDrawing) {
          isDrawing = false;
        }
      }

      cvs.addEventListener('pointerdown', startDraw);
      cvs.addEventListener('pointermove', drawMove);
      cvs.addEventListener('pointerup', stopDraw);
      cvs.addEventListener('pointercancel', stopDraw);

      document.getElementById('btn-clear-canvas').onclick = () => {
        sound.playPop();
        ctx.clearRect(0, 0, cvs.width, cvs.height);
      };
    }

          <input type="text" placeholder="Ketik Nama Anak Di Sini" class="w-3/4 text-center font-black text-base py-2 px-3 rounded-xl border-2 border-amber-400 bg-white text-slate-800 shadow-inner focus:outline-none focus:ring-2 focus:ring-amber-500">
          <p class="text-[11px] font-semibold text-slate-600 max-w-xs">
            Selamat! Telah menyelesaikan seluruh tantangan Asosiasi Visual, Motorik Menulis, dan Logika Geometri!
          </p>
          <button id="btn-cheer" class="py-2.5 px-6 rounded-2xl bg-amber-500 text-white font-black text-sm card-bubble-sm shadow-amber-300 btn-bounce">
            Rayakan Kelulusan! 🎉
          </button>
        </div>
      `;

      document.getElementById('btn-cheer').addEventListener('pointerdown', () => {
        triggerGrandCelebration("JUARA SEJATI! 🏆", "Selamat! Kamu telah resmi menyelesaikan seluruh lembar tantangan belajar!");
      });
    }

    function renderDirection(act) {
      toolbarDrawing.classList.add('hidden');
      container.innerHTML = `
        <div class="w-full h-full flex flex-col justify-around items-center p-3 text-center">
          <p class="text-base sm:text-lg font-black text-slate-800">${act.question}</p>
          <div class="flex gap-4 justify-center items-center flex-wrap">
            ${act.options.map(opt => `
              <button data-correct="${opt.isCorrect}" class="dir-choice bg-white rounded-3xl p-5 border-3 border-slate-200 card-bubble flex flex-col items-center justify-center gap-2 btn-bounce">
                <span class="text-5xl ${opt.flip ? '-scale-x-100' : ''} inline-block">${opt.icon}</span>
                <span class="text-xs font-black text-slate-500">${opt.flip ? 'Kiri 👈' : 'Kanan 👉'}</span>
              </button>
            `).join('')}
          </div>
        </div>
      `;

      container.querySelectorAll('.dir-choice').forEach(btn => {
        btn.addEventListener('pointerdown', () => {
          const isCorrect = btn.getAttribute('data-correct') === 'true';
          if (isCorrect) {
            btn.classList.add('ring-4', 'ring-emerald-400', 'bg-emerald-50', 'cheer');
            triggerGrandCelebration();
          } else {
            sound.playWrong();
            btn.classList.add('shake');
            setTimeout(() => btn.classList.remove('shake'), 400);
          }
        });
      });
    }

    function renderDotToDot(act) {
      toolbarDrawing.classList.add('hidden');
      container.innerHTML = `
        <div class="relative w-full h-full flex flex-col justify-between items-center p-2">
          <div class="text-xs font-black text-slate-500 bg-amber-50 px-3 py-1 rounded-full border border-amber-200">
            Sentuh titik berurutan: 1 ➔ 2 ➔ 3 ➔ 4 ➔ 5
          </div>
          <div class="relative flex-1 w-full max-w-sm my-2 bg-white rounded-2xl border-2 border-slate-200 card-bubble-sm overflow-hidden">
            <svg id="svg-dot-lines" class="absolute inset-0 w-full h-full pointer-events-none"></svg>
            <div id="dot-container" class="absolute inset-0 w-full h-full">
              ${act.dots.map(d => `
                <button data-num="${d.num}" class="dot-btn absolute -translate-x-1/2 -translate-y-1/2 w-11 h-11 rounded-full bg-blue-500 text-white font-black text-base flex items-center justify-center card-bubble-sm border-2 border-white btn-bounce z-10" style="left: ${d.x}%; top: ${d.y}%;">
                  ${d.num}
                </button>
              `).join('')}
            </div>
          </div>
        </div>
      `;

      let nextExpected = 1;
      const clickedDots = [];
      const svg = document.getElementById('svg-dot-lines');

      container.querySelectorAll('.dot-btn').forEach(btn => {
        btn.addEventListener('pointerdown', () => {
          const num = parseInt(btn.getAttribute('data-num'));
          if (num === nextExpected) {
            sound.playPop();
            btn.classList.remove('bg-blue-500');
            btn.classList.add('bg-emerald-500', 'ring-4', 'ring-emerald-300', 'scale-110');
            clickedDots.push(btn);

            if (clickedDots.length > 1) {
              const prev = clickedDots[clickedDots.length - 2].getBoundingClientRect();
              const curr = btn.getBoundingClientRect();
              const svgRect = svg.getBoundingClientRect();
              const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
              line.setAttribute('x1', prev.left + prev.width / 2 - svgRect.left);
              line.setAttribute('y1', prev.top + prev.height / 2 - svgRect.top);
              line.setAttribute('x2', curr.left + curr.width / 2 - svgRect.left);
              line.setAttribute('y2', curr.top + curr.height / 2 - svgRect.top);
              line.setAttribute('stroke', '#10b981');
              line.setAttribute('stroke-width', '5');
              line.setAttribute('stroke-linecap', 'round');
              line.setAttribute('stroke-dasharray', '6,6');
              svg.appendChild(line);
            }

            nextExpected++;
            if (nextExpected > act.dots.length) {
              setTimeout(() => {
                triggerGrandCelebration("BINTANG TERBENTUK! 🌟", "Kamu sukses menyambungkan semua titik angka!");
              }, 300);
            }
          } else {
            sound.playWrong();
            btn.classList.add('shake');
            setTimeout(() => btn.classList.remove('shake'), 400);
          }
        });
      });
    }

    function loadPage(pageNum) {
      if (pageNum < 1) pageNum = 1;
      if (pageNum > activities.length) pageNum = activities.length;
      state.currentPage = pageNum;
      localStorage.setItem('kids_act_page', pageNum.toString());

      const currentAct = activities.find(a => a.id === pageNum) || activities[0];

      // Update UI Header
      titleEl.innerText = currentAct.title;
      descEl.innerText = currentAct.desc;
      badgeEl.innerText = currentAct.moduleName;
      pageIndEl.innerText = `HAL ${currentAct.id} / ${activities.length}`;
      progressEl.style.width = `${(currentAct.id / activities.length) * 100}%`;

      // Render based on type
      if (currentAct.type === 'matching') renderMatching(currentAct);
      else if (currentAct.type === 'tracing') renderTracing(currentAct);
      else if (currentAct.type === 'maze') renderMaze(currentAct);
      else if (currentAct.type === 'comparison') renderComparison(currentAct);
      else if (currentAct.type === 'pattern') renderPattern(currentAct);
      else if (currentAct.type === 'odd-one-out') renderOddOneOut(currentAct);
      else if (currentAct.type === 'direction') renderDirection(currentAct);
      else if (currentAct.type === 'dot-to-dot') renderDotToDot(currentAct);
      else if (currentAct.type === 'counting') renderCounting(currentAct);
      else if (currentAct.type === 'certificate') renderCertificate(currentAct);
      else renderMatching(currentAct);
    }

    const praiseTitles = [
      "LUAR BIASA! 🌟",
      "HEBAT SEKALI! 🥳",
      "PINTAR BANGET! 🎯",
      "KAMU JUARA! 🥇",
      "HOREEE BERHASIL! 🎈"
    ];
    const praiseDescs = [
      "Wah, jawabanmu tepat dan rapi sekali!",
      "Kamu menyelesaikan tantangan ini seperti anak pintar!",
      "Keren! Mari lanjut ke halaman seru berikutnya!",
      "Mata dan tanganmu sungguh lincah dan teliti!",
      "Bagus sekali! Siap untuk tantangan selanjutnya?"
    ];

    function triggerGrandCelebration(customTitle = null, customDesc = null) {
      sound.playFanfare();
      triggerConfetti();

      const modalSuccess = document.getElementById('modal-success');
      const titleEl = document.getElementById('success-title');
      const descEl = document.getElementById('success-desc');
      const iconEl = document.getElementById('success-icon');

      const randIdx = Math.floor(Math.random() * praiseTitles.length);
      titleEl.innerText = customTitle || praiseTitles[randIdx];
      descEl.innerText = customDesc || praiseDescs[randIdx];

      const icons = ['🎉', '🚀', '🦄', '🏆', '🦁', '🌟'];
      iconEl.innerText = icons[Math.floor(Math.random() * icons.length)];

      setTimeout(() => {
        modalSuccess.classList.remove('hidden');
      }, 350);
    }

    /* Multi-burst Confetti Particle Burst Animation */
    function triggerConfetti() {
      const c = document.getElementById('confetti-canvas');
      c.classList.remove('hidden');
      c.width = window.innerWidth;
      c.height = window.innerHeight;
      const ctx = c.getContext('2d');
      const particles = [];
      const colors = ['#f43f5e', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#eab308'];

      // Left and right dual cannon burst
      for (let i = 0; i < 90; i++) {
        const fromLeft = i % 2 === 0;
        particles.push({
          x: fromLeft ? c.width * 0.2 : c.width * 0.8,
          y: c.height * 0.6,
          vx: fromLeft ? (Math.random() * 8 + 3) : -(Math.random() * 8 + 3),
          vy: -(Math.random() * 14 + 8),
          size: Math.random() * 9 + 4,
          shape: Math.random() > 0.4 ? 'circle' : 'rect',
          rotation: Math.random() * 360,
          rotationSpeed: (Math.random() - 0.5) * 8,
          color: colors[Math.floor(Math.random() * colors.length)],
          gravity: 0.38,
          alpha: 1
        });
      }

      function update() {
        ctx.clearRect(0, 0, c.width, c.height);
        let active = false;
        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += p.gravity;
          p.alpha -= 0.012;
          p.rotation += p.rotationSpeed;

          if (p.alpha > 0) {
            active = true;
            ctx.save();
            ctx.globalAlpha = Math.max(0, p.alpha);
            ctx.translate(p.x, p.y);
            ctx.rotate((p.rotation * Math.PI) / 180);
            ctx.fillStyle = p.color;
            if (p.shape === 'circle') {
              ctx.beginPath();
              ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
              ctx.fill();
            } else {
              ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
            }
            ctx.restore();
          }
        });
        if (active) requestAnimationFrame(update);
        else c.classList.add('hidden');
      }
      update();
    }

    document.getElementById('btn-popup-continue').onclick = () => {
      sound.playPop();
      document.getElementById('modal-success').classList.add('hidden');
      if (state.currentPage < activities.length) {
        loadPage(state.currentPage + 1);
      } else {
        loadPage(1); // loop back or finish
      }
    };

    document.getElementById('btn-popup-replay').onclick = () => {
      sound.playPop();
      document.getElementById('modal-success').classList.add('hidden');
      loadPage(state.currentPage);
    };

    // Drawing toolbar finish button
    document.getElementById('btn-finish-drawing').onclick = () => {
      triggerGrandCelebration("GAMBARMU KEREN! 🎨", "Goresan garis dan warnamu rapi sekali!");
    };

    /* Setup Global Event Listeners */
    document.getElementById('btn-prev').onclick = () => {
      sound.playPop();
      loadPage(state.currentPage - 1);
    };

    document.getElementById('btn-next').onclick = () => {
      sound.playPop();
      loadPage(state.currentPage + 1);
    };

    document.getElementById('btn-reset-page').onclick = () => {
      sound.playPop();
      loadPage(state.currentPage);
    };

    document.getElementById('btn-sound').onclick = () => {
      sound.enabled = !sound.enabled;
      state.soundMuted = !sound.enabled;
      localStorage.setItem('kids_act_muted', state.soundMuted.toString());
      document.getElementById('btn-sound').innerText = sound.enabled ? '🔊' : '🔇';
    };

    // Color Swatches
    document.querySelectorAll('.color-swatch').forEach(swatch => {
      swatch.onclick = () => {
        sound.playPop();
        document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('ring-2', 'ring-blue-500'));
        swatch.classList.add('ring-2', 'ring-blue-500');
        state.brushColor = swatch.getAttribute('data-color');
      };
    });

    // Menu Modal
    const modalMenu = document.getElementById('modal-menu');
    const pageGrid = document.getElementById('page-grid-list');
    
    function populateMenuGrid(moduleFilter = null) {
      pageGrid.innerHTML = '';
      activities.forEach((act, idx) => {
        if (moduleFilter && act.module !== parseInt(moduleFilter)) return;
        const btn = document.createElement('button');
        btn.className = `p-2 rounded-2xl flex flex-col items-center justify-center font-black text-sm border-2 ${state.currentPage === act.id ? 'bg-amber-400 text-amber-950 border-amber-500' : 'bg-slate-50 text-slate-700 border-slate-200'} btn-bounce card-bubble-sm`;
        btn.innerHTML = `<span>${act.id}</span>`;
        btn.onclick = () => {
          sound.playPop();
          modalMenu.classList.add('hidden');
          loadPage(act.id);
        };
        pageGrid.appendChild(btn);
      });
    }

    document.getElementById('btn-menu').onclick = () => {
      sound.playPop();
      populateMenuGrid();
      modalMenu.classList.remove('hidden');
    };
    document.getElementById('btn-close-menu').onclick = () => {
      sound.playPop();
      modalMenu.classList.add('hidden');
    };

    document.querySelectorAll('.filter-tab').forEach(tab => {
      tab.onclick = () => {
        sound.playPop();
        document.querySelectorAll('.filter-tab').forEach(t => {
          t.classList.remove('bg-blue-500', 'text-white');
          t.classList.add('bg-slate-100', 'text-slate-600');
        });
        tab.classList.remove('bg-slate-100', 'text-slate-600');
        tab.classList.add('bg-blue-500', 'text-white');
        populateMenuGrid(tab.getAttribute('data-mod-filter'));
      };
    });

    // Initial Launch
    window.onload = () => {
      loadPage(state.currentPage);
    };
  </script>
</body>
</html>
